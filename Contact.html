<!doctype html>
<html>
  <div id="header"></div>
  <head>
    <title>Contact</title>
  </head>
  <body>
    <ul>
      <li><a href="mailto:josephzavilla@gmail.com">Email</a></li>
      <li><a href="https://www.instagram.com/joeissuperrad/">Instagram</a></li>
      <li>
        <a
          href="https://patreon.com/JosephZavilla?utm_medium=unknown&utm_source=join_link&utm_campaign=creatorshare_creator&utm_content=copyLink"
          >give me money</a
        >
      </li>
    </ul>

    <script>
      fetch("header.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;

          // Run active navigation after header exists
          const currentPage = window.location.pathname.split("/").pop();

          document.querySelectorAll(".navigation a").forEach((link) => {
            const linkPage = link.getAttribute("href").split("/").pop();

            if (linkPage === currentPage) {
              link.classList.add("active");
            }
          });
        });
    </script>
    <script>
      console.log("NAV SCRIPT RUNNING");

      const currentPage = window.location.pathname.split("/").pop();

      console.log("Current page:", currentPage);
      console.log(document.querySelectorAll(".navigation a"));
      document.querySelectorAll(".navigation a").forEach((link) => {
        const linkPage = link.getAttribute("href").split("/").pop();

        console.log(linkPage);

        if (linkPage === currentPage) {
          console.log("MATCH FOUND:", linkPage);
          link.classList.add("active");
        }
      });
    </script>
  </body>
</html>
