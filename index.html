<!doctype html>
<html>
  <head>
    <title>About</title>
    <link rel="stylesheet" href="css/about.css" />
  </head>
  <div id="header"></div>
  <body>
    <h1>HACK OF ALL TRADES</h1>
    <div class="content-container">
      <img src="/miscassets/aboutphoto.jpg" alt="" />
      <p>
        Joseph Zavilla is a writer, filmmaker, painter, musician, sculpter,
        illustrator, photographer, game dev and programmer. He is actively
        pursuing a sponsorship deal with Arizona Iced Tea.
      </p>
    </div>

    <footer>
      <p>born lucky</p>
    </footer>

    <script>
      fetch("header.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;

          // Run active navigation after header exists
          const currentPage = window.location.pathname.split("/").pop();

          document.querySelectorAll(".navigation a").forEach((link) => {
            const linkPage = link.getAttribute("href").split("/").pop();

            if (linkPage === currentPage) {
              link.classList.add("active");
            }
          });
        });
    </script>
    <script>
      console.log("NAV SCRIPT RUNNING");

      const currentPage = window.location.pathname.split("/").pop();

      console.log("Current page:", currentPage);
      console.log(document.querySelectorAll(".navigation a"));
      document.querySelectorAll(".navigation a").forEach((link) => {
        const linkPage = link.getAttribute("href").split("/").pop();

        console.log(linkPage);

        if (linkPage === currentPage) {
          console.log("MATCH FOUND:", linkPage);
          link.classList.add("active");
        }
      });
    </script>
  </body>
</html>
