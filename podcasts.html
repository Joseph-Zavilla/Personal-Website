<!doctype html>
<html>
  <head>
    <title>Podcasts</title>
  </head>
  <body>
    <div id="header"></div>
    <h3>Zoo: The Show: The Podcast</h3>
    <p>
      Join Joey, William and Dallas they struggle to understand the 2015 CBS
      show, Zoo, and escape the lion enclosure they're trapped in.
    </p>
    <a href="https://open.spotify.com/show/43BYM0h2vhsO9ZkSMJArC9">Spotify</a>
    <a
      href="https://podcasts.apple.com/us/podcast/zoo-the-show-the-podcast/id1467410972"
      >Apple</a
    >

    <script>
      fetch("header.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("header").innerHTML = data;

          // Run active navigation after header exists
          const currentPage = window.location.pathname.split("/").pop();

          document.querySelectorAll(".navigation a").forEach((link) => {
            const linkPage = link.getAttribute("href").split("/").pop();

            if (linkPage === currentPage) {
              link.classList.add("active");
            }
          });
        });
    </script>
    <script>
      console.log("NAV SCRIPT RUNNING");

      const currentPage = window.location.pathname.split("/").pop();

      console.log("Current page:", currentPage);
      console.log(document.querySelectorAll(".navigation a"));
      document.querySelectorAll(".navigation a").forEach((link) => {
        const linkPage = link.getAttribute("href").split("/").pop();

        console.log(linkPage);

        if (linkPage === currentPage) {
          console.log("MATCH FOUND:", linkPage);
          link.classList.add("active");
        }
      });
    </script>
  </body>
</html>
